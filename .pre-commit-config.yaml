# Run every check:      pre-commit run --all-files
# Enable on each clone: pre-commit install   (installs the pre-commit and commit-msg hooks)
# Hook versions are pinned and kept current by Dependabot, so every machine and CI get identical results.
minimum_pre_commit_version: "3.0.0"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop, --branch, qa]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=no]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/maxwinterstein/shfmt-py
    rev: v4.2.0
    hooks:
      - id: shfmt
        args: [-w]

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-dependabot

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  - repo: local
    hooks:
      - id: single-line-commit-message
        name: commit message must be a single line
        entry: scripts/check-commit-message.sh
        language: script
        stages: [commit-msg]

      - id: spdx-license-header
        name: shell and python files must carry an SPDX license identifier in their first lines
        language: pygrep
        entry: '\A(?!(?:[^\n]*\n){0,2}[^\n]*SPDX-License-Identifier: MIT)'
        args: [--multiline]
        types_or: [shell, python]

      - id: no-lint-suppressions
        name: lint rules are fixed, never suppressed
        language: pygrep
        entry: '#\s*(noqa|type:\s*ignore|shellcheck\s+disable|fmt:\s*(off|skip))|ruff:\s*noqa|per-file-ignores|^\s*(ignore|extend-ignore|disable)\s*='
        types: [text]
        files: '(\.(sh|py|toml)|\.shellcheckrc)$'
